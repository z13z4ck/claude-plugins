<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">advisor-select</title>
  <desc id="desc">The main conversation runs on Sonnet and consults a read-only advisor whose model is chosen per session: opus (selected), sonnet, haiku or fable, set with /advisor-select:use opus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- header -->
    <text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#a78bfa">advisor-select</text>
    <text x="40" y="80" font-size="16" fill="#8b949e">Run the main conversation on one model and take second opinions from another, chosen per session.</text>

    <!-- connectors -->
    <g fill="none" stroke-width="2">
      <path d="M380 176 H468" stroke="#a78bfa" marker-end="url(#arrowViolet)"/>
      <path d="M470 204 H382" stroke="#8b949e" marker-end="url(#arrow)"/>
    </g>
    <g font-size="14" fill="#8b949e" text-anchor="middle">
      <text x="425" y="166">consult</text>
      <text x="425" y="226">verdict</text>
    </g>

    <!-- main conversation -->
    <rect x="40" y="108" width="340" height="156" rx="16" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <text x="64" y="146" font-size="18" font-weight="700" fill="#e6edf3">Main conversation</text>
    <rect x="64" y="166" width="120" height="40" rx="20" fill="#21262d" stroke="#484f58" stroke-width="1.5"/>
    <text x="124" y="192" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Sonnet</text>
    <text x="64" y="242" font-size="14" fill="#8b949e">fast and cheap, every turn</text>

    <!-- advisor -->
    <rect x="470" y="108" width="690" height="156" rx="16" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="494" y="146" font-size="18" font-weight="700" fill="#e6edf3">Advisor model</text>
    <text x="620" y="146" font-size="14" fill="#8b949e">read-only second opinion</text>

    <rect x="1030" y="127" width="106" height="26" rx="13" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1"/>
    <text x="1083" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#a78bfa">per session</text>

    <!-- chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">
      <rect x="494" y="166" width="144" height="40" rx="20" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-width="2"/>
      <path d="M514 186 L519 191 L528 181" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="572" y="192" font-weight="700" fill="#e6edf3">opus</text>

      <rect x="660" y="166" width="144" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="732" y="192" fill="#8b949e">sonnet</text>

      <rect x="826" y="166" width="144" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="898" y="192" fill="#8b949e">haiku</text>

      <rect x="992" y="166" width="144" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="1064" y="192" fill="#8b949e">fable</text>
    </g>

    <text x="494" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b949e">/advisor-select:use <tspan fill="#a78bfa">opus</tspan></text>
    <text x="1136" y="242" text-anchor="end" font-size="14" fill="#8b949e">survives compaction · resets in a new session</text>
  </g>
</svg>
